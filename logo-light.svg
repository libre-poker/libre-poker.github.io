<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="240" height="240">
  <!-- Libre Poker — light-surface mark: chip ring, spade, node graph.
       The network inside the suit: no server owns the truth. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- chip ring: ink base, eight green edge-stripes via dashed overlay -->
    <circle r="100" stroke="#2a2520" stroke-width="20"/>
    <circle r="100" stroke="#2e7d43" stroke-width="20"
            stroke-dasharray="39.27 39.27" transform="rotate(11.25)"/>
    <!-- inner rail -->
    <circle r="80" stroke="#2a2520" stroke-width="3.5"/>
    <!-- the spade, outlined -->
    <path d="M0,-56
             C 26,-26 44,-14 44,10
             C 44,32 25,41 12,33
             C 7,30 4,26 2,21
             C 5,38 9,46 16,56
             L -16,56
             C -9,46 -5,38 -2,21
             C -4,26 -7,30 -12,33
             C -25,41 -44,32 -44,10
             C -44,-14 -26,-26 0,-56 Z"
          stroke="#2a2520" stroke-width="7"/>
    <!-- the graph: four nodes, irregular, connected -->
    <g stroke="#2e7d43" stroke-width="5">
      <line x1="-2" y1="-16" x2="-18" y2="4"/>
      <line x1="-2" y1="-16" x2="15" y2="-2"/>
      <line x1="15" y1="-2" x2="4" y2="16"/>
      <line x1="-18" y1="4" x2="4" y2="16"/>
      <circle cx="-2" cy="-16" r="6.5" fill="#faf6ef"/>
      <circle cx="-18" cy="4" r="6.5" fill="#faf6ef"/>
      <circle cx="15" cy="-2" r="6.5" fill="#faf6ef"/>
      <circle cx="4" cy="16" r="6.5" fill="#faf6ef"/>
    </g>
  </g>
</svg>
